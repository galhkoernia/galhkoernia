<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" shape-rendering="crispEdges" role="img" aria-label="Pinguin pixel-art berjalan ke kanan membawa komputer CRT retro, dengan orbit atom samar di latar belakang" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Pinguin sprite membawa komputer retro</title>

  <!-- =====================================================
       STYLE & ANIMASI
       Siklus langkah = 0.8s (4 frame). Ubah .8s di semua .legs-* dan .bob.
       Waktu menyeberang layar = 24s (animasi "walk").
       ===================================================== -->
  <style>
    .walker  { animation: walk 24s linear infinite; }
    .bob     { animation: bob .8s step-end infinite; }
    .legs-together { animation: fTogether .8s step-end infinite; }
    .legs-apart1   { opacity: 0; animation: fApart1 .8s step-end infinite; }
    .legs-apart2   { opacity: 0; animation: fApart2 .8s step-end infinite; }
    .cursor  { animation: blink 1s step-end infinite; }
    .glow    { animation: glow 3s ease-in-out infinite; }

    /* Berjalan dari kiri (di luar layar) ke kanan (di luar layar), lalu ulang tanpa lompatan terlihat */
    @keyframes walk { from { transform: translateX(-400px); } to { transform: translateX(1290px); } }
    /* Frame 1 kontak (badan turun), 2 lewat (badan naik), 3 kontak, 4 lewat */
    @keyframes bob { 0% { transform: translateY(6px); } 25% { transform: translateY(0); }
                      50% { transform: translateY(6px); } 75% { transform: translateY(0); } }
    @keyframes fApart1   { 0% { opacity: 1; } 25% { opacity: 0; } }
    @keyframes fApart2   { 0% { opacity: 0; } 50% { opacity: 1; } 75% { opacity: 0; } }
    @keyframes fTogether { 0% { opacity: 0; } 25% { opacity: 1; } 50% { opacity: 0; } 75% { opacity: 1; } }
    @keyframes blink { 0%,50% { opacity: 1; } 51%,100% { opacity: 0; } }
    @keyframes glow  { 0%,100% { opacity: .12; } 50% { opacity: .26; } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    text { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; }
  </style>

  <defs>
    <!-- Gradient orbit atom: putih -> biru dingin -> ungu -> cyan redup -->
    <linearGradient id="atomGrad" gradientUnits="userSpaceOnUse" x1="-790" y1="0" x2="790" y2="0">
      <stop offset="0"   stop-color="#ffffff"/>
      <stop offset=".35" stop-color="#93b4ff"/>
      <stop offset=".7"  stop-color="#a78bfa"/>
      <stop offset="1"   stop-color="#67e8f9"/>
    </linearGradient>
    <filter id="softBlur" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="screenBlur" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1280" height="320" fill="#0d1117"/>

  <!-- =====================================================
       ATOM AMBIENT (opacity rendah; orbit melebihi viewBox)
       ===================================================== -->
  <g transform="translate(640 150)" fill="none" stroke="url(#atomGrad)">
    <g stroke-width="3" opacity=".10" filter="url(#softBlur)" shape-rendering="geometricPrecision">
      <ellipse rx="790" ry="140" transform="rotate(0)"/>
      <ellipse rx="740" ry="128" transform="rotate(19)"/>
      <ellipse rx="700" ry="116" transform="rotate(-19)"/>
    </g>
    <g stroke-width="1" opacity=".28" shape-rendering="geometricPrecision">
      <ellipse rx="790" ry="140" transform="rotate(0)"/>
      <ellipse rx="740" ry="128" transform="rotate(19)"/>
      <ellipse rx="700" ry="116" transform="rotate(-19)"/>
    </g>
    <g transform="rotate(0)"><circle opacity=".65" r="2.5" fill="#e0f2fe"><animateMotion dur="60s" begin="-10s" repeatCount="indefinite" path="M790,0 A790,140 0 1,1 -790,0 A790,140 0 1,1 790,0 Z"/></circle></g>
    <g transform="rotate(19)"><circle opacity=".65" r="2.5" fill="#ddd6fe"><animateMotion dur="76s" begin="-40s" repeatCount="indefinite" path="M740,0 A740,128 0 1,1 -740,0 A740,128 0 1,1 740,0 Z"/></circle></g>
    <g transform="rotate(-19)"><circle opacity=".65" r="2.5" fill="#a5f3fc"><animateMotion dur="68s" begin="-25s" repeatCount="indefinite" path="M700,0 A700,116 0 1,1 -700,0 A700,116 0 1,1 700,0 Z"/></circle></g>
    <circle r="3" fill="#dbeafe" stroke="none" opacity=".6" shape-rendering="geometricPrecision"/>
  </g>

  <!-- TANAH -->
  <rect x="0" y="278" width="1280" height="2" fill="#2a3140"/>
  <g fill="#2a3140">
    <rect x="90" y="272" width="12" height="6"/><rect x="418" y="274" width="6" height="4"/>
    <rect x="702" y="272" width="12" height="6"/><rect x="986" y="274" width="6" height="4"/>
    <rect x="1190" y="272" width="12" height="6"/>
  </g>

  <!-- =====================================================
       WALKER: pinguin + komputer + bubble (bergerak ke kanan)
       Pasang posisi awal statis di transform="translate(300 0)"
       ===================================================== -->
  <g transform="translate(0 128)">
   <g class="walker" transform="translate(300 0)">

    <!-- Kaki: 3 pose (frame-based), digambar di belakang badan -->
    <g id="legs">
     <g class="legs-together" transform="translate(0 138)">
      <path fill="#c96f0a" d="M30 0h6v6h-6zM30 6h18v6h-18z"/>
      <path fill="#ff9f1c" d="M54 0h6v6h-6zM54 6h18v6h-18z"/>
     </g>
     <g class="legs-apart1" transform="translate(0 138)">
      <path fill="#c96f0a" d="M18 0h6v6h-6zM18 6h18v6h-18z"/>
      <path fill="#ff9f1c" d="M60 0h6v6h-6zM60 6h18v6h-18z"/>
     </g>
     <g class="legs-apart2" transform="translate(0 138)">
      <path fill="#ff9f1c" d="M18 0h6v6h-6zM18 6h18v6h-18z"/>
      <path fill="#c96f0a" d="M60 0h6v6h-6zM60 6h18v6h-18z"/>
     </g>
    </g>

    <!-- Badan + komputer (naik-turun 1 piksel per langkah) -->
    <g class="bob" id="sprite">
      <path fill="#a39c86" d="M12 0h60v6h-60zM12 6h6v6h-6zM66 6h6v6h-6zM0 12h84v6h-84zM0 18h6v6h-6zM78 18h6v6h-6zM0 24h6v6h-6zM78 24h6v6h-6zM0 30h6v6h-6zM78 30h6v6h-6zM0 36h6v6h-6zM78 36h6v6h-6zM0 42h6v6h-6zM78 42h6v6h-6zM0 48h6v6h-6zM78 48h6v6h-6zM0 54h84v6h-84z"/>
      <path fill="#c2baa2" d="M18 6h48v6h-48zM48 48h18v6h-18z"/>
      <path fill="#e8e1cc" d="M6 18h6v6h-6zM72 18h6v6h-6zM6 24h6v6h-6zM72 24h6v6h-6zM6 30h6v6h-6zM72 30h6v6h-6zM6 36h6v6h-6zM72 36h6v6h-6zM6 42h6v6h-6zM72 42h6v6h-6zM6 48h6v6h-6zM36 48h12v6h-12zM72 48h6v6h-6z"/>
      <path fill="#8f8a76" d="M12 18h60v6h-60zM12 24h6v6h-6zM66 24h6v6h-6zM12 30h6v6h-6zM66 30h6v6h-6zM12 36h6v6h-6zM66 36h6v6h-6zM12 42h60v6h-60z"/>
      <path fill="#08201f" d="M18 24h6v6h-6zM30 24h36v6h-36zM18 30h12v6h-12zM36 30h12v6h-12zM60 30h6v6h-6zM18 36h6v6h-6zM30 36h36v6h-36z"/>
      <path fill="#6dffb0" d="M24 24h6v6h-6zM30 30h6v6h-6zM48 30h12v6h-12zM24 36h6v6h-6z"/>
      <path fill="#4b4739" d="M12 48h24v6h-24z"/>
      <path fill="#4ade80" d="M66 48h6v6h-6z"/>
      <path fill="#475166" d="M0 60h12v6h-12zM78 60h12v6h-12zM0 66h12v6h-12zM78 66h12v6h-12zM0 72h12v6h-12zM78 72h12v6h-12zM0 78h12v6h-12zM78 78h12v6h-12zM0 84h12v6h-12zM78 84h12v6h-12zM0 90h12v6h-12z"/>
      <path fill="#566178" d="M24 60h36v6h-36zM18 66h6v6h-6zM60 66h6v6h-6zM18 72h6v6h-6zM60 72h6v6h-6zM18 78h6v6h-6zM18 84h6v6h-6zM12 90h6v6h-6zM78 90h6v6h-6zM6 96h6v6h-6zM84 96h6v6h-6zM6 102h6v6h-6zM84 102h6v6h-6zM6 108h6v6h-6zM84 108h6v6h-6zM6 114h6v6h-6zM84 114h6v6h-6zM6 120h6v6h-6zM84 120h6v6h-6zM0 126h6v6h-6zM12 126h6v6h-6zM78 126h6v6h-6zM0 132h84v6h-84z"/>
      <path fill="#2b3240" d="M24 66h36v6h-36zM24 72h24v6h-24zM24 78h36v6h-36zM24 84h36v6h-36zM18 90h36v6h-36zM12 96h36v6h-36zM12 102h36v6h-36zM12 108h36v6h-36zM12 114h36v6h-36zM12 120h36v6h-36zM6 126h6v6h-6zM18 126h30v6h-30z"/>
      <path fill="#ffffff" d="M48 72h6v6h-6z"/>
      <path fill="#0b0d12" d="M54 72h6v6h-6z"/>
      <path fill="#ffb52e" d="M60 78h18v6h-18z"/>
      <path fill="#e0801a" d="M60 84h18v6h-18z"/>
      <path fill="#f3efe4" d="M54 90h24v6h-24zM48 96h36v6h-36zM48 102h36v6h-36zM48 108h36v6h-36zM48 114h30v6h-30zM48 120h30v6h-30zM48 126h24v6h-24z"/>
      <path fill="#cfc9b8" d="M78 114h6v6h-6zM78 120h6v6h-6zM72 126h6v6h-6z"/>
      <!-- Cahaya layar ringan -->
      <rect class="glow" x="16" y="22" width="52" height="22" fill="#5cf2c0" filter="url(#screenBlur)"/>
      <!-- Kursor layar berkedip -->
      <rect class="cursor" x="42" y="36" width="6" height="6" fill="#6dffb0"/>

      <!-- Bubble terminal mini (ikut bergerak bersama badan) -->
      <g id="bubble">
        <rect x="104" y="10" width="190" height="34" fill="#0b1118" stroke="#4b5b73" stroke-width="2"/>
        <path d="M104 20H98V26H92V32H98V38H104Z" fill="#0b1118" stroke="#4b5b73" stroke-width="2"/>
        <rect x="103" y="21" width="3" height="17" fill="#0b1118"/>
        <text x="116" y="32"><tspan fill="#9ecbff">console</tspan><tspan fill="#8b97a8">.</tspan><tspan fill="#e7d28a">log</tspan><tspan fill="#8b97a8">(</tspan><tspan fill="#9fe0b0">"Hi!"</tspan><tspan fill="#8b97a8">);</tspan></text>
        <rect class="cursor" x="282" y="21" width="7" height="14" fill="#9fe0b0"/>
      </g>
    </g>

   </g>
  </g>
</svg>
