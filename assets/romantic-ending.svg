<svg viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" width="100%" height="220">
<defs>
  <style>
    .pixel { shape-rendering: crispEdges; }
  </style>
  <filter id="moonGlow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
    <feGaussianBlur stdDeviation="0.6" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <g id="starPixel" class="pixel">
    <rect x="-1" y="-1" width="2" height="2" fill="#ffffff"/>
  </g>
  <g id="bladeShape" class="pixel">
    <rect x="-1" y="-8" width="2" height="8" fill="#2e7d4f"/>
  </g>
  <g id="flowerShape" class="pixel">
    <rect x="-1" y="-3" width="2" height="6" fill="#3a8f5c"/>
    <rect x="-3" y="-6" width="2" height="2" fill="#ffd6e8"/>
    <rect x="1" y="-6" width="2" height="2" fill="#ffd6e8"/>
    <rect x="-1" y="-8" width="2" height="2" fill="#ffd6e8"/>
    <rect x="-1" y="-6" width="2" height="2" fill="#ffef9f"/>
  </g>
</defs>

<g>
  <rect x="0" y="0" width="900" height="220" fill="#0d1117" class="pixel"/>
</g>

<g filter="url(#moonGlow)">
